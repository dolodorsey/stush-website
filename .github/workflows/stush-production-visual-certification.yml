name: STUSH Production Visual Certification

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  certify-live-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCTION_URL: https://stushusa.com
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Wait for exact Vercel commit on production
        shell: bash
        run: |
          set -euo pipefail
          matched="false"
          for attempt in $(seq 1 60); do
            if curl -fsS "$PRODUCTION_URL/api/build-info" -o /tmp/stush-build-info.json; then
              live_sha="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('/tmp/stush-build-info.json','utf8'));process.stdout.write(x.commitSha||'')}catch{}")"
              echo "Attempt $attempt: live=$live_sha expected=$EXPECTED_SHA"
              if [ "$live_sha" = "$EXPECTED_SHA" ]; then
                matched="true"
                break
              fi
            else
              echo "Attempt $attempt: production build-info not ready"
            fi
            sleep 10
          done
          if [ "$matched" != "true" ]; then
            echo "::error::Production never served the exact commit $EXPECTED_SHA within the certification window."
            exit 1
          fi

      - name: Install production QA browser
        run: npx playwright install --with-deps chromium

      - name: Screenshot and interact with live production
        env:
          VISUAL_BASE_URL: https://stushusa.com
          VISUAL_QA_DIR: artifacts/production-visual-qa
        run: node tests/visual-qa.mjs

      - name: Upload live production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stush-production-visual-${{ github.sha }}
          path: artifacts/production-visual-qa
          if-no-files-found: error
          retention-days: 30
