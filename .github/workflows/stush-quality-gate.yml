name: STUSH Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production app
        run: npm run build

      - name: Verify retired collection redirects
        shell: bash
        run: |
          npm run start > /tmp/stush-next.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/; then
              break
            fi
            sleep 1
          done

          for path in all the-outerwear-vault the-sets-edit; do
            headers="$(curl --silent --show-error --head "http://127.0.0.1:3000/collections/$path")"
            printf '%s\n' "$headers"
            printf '%s\n' "$headers" | grep -Eiq '^location: /collections/stush\r?$'
          done
