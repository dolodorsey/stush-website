          EOF

          while IFS='|' read -r handle url; do
            [ -n "$handle" ] || continue
            clean="${url%%\?*}"
            ext="${clean##*.}"
            curl -L --fail --retry 3 --silent --show-error "$url" -o "images/${handle}.${ext}"
          done < /tmp/stush-images.txt

          count=$(find images -type f | wc -l | tr -d ' ')
          test "$count" = "52"
          printf 'Downloaded %s active STUSH product hero images\n' "$count" > images/README.txt

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: stush-active-product-images-2026-09-10
          path: images/
          if-no-files-found: error
          retention-days: 7
