name: STUSH Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify live STUSH catalog pricing and naming
        run: node tests/catalog-qa.mjs

      - name: Build production app
        run: npm run build

      - name: Verify storefront route contracts
        shell: bash
        run: |
          npm run start > /tmp/stush-next.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT

          ready=false
          for attempt in {1..20}; do
            if curl --silent --fail --max-time 5 --output /dev/null http://127.0.0.1:3000/; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/stush-next.log
            exit 1
          fi

          for path in all the-outerwear-vault the-sets-edit; do
            headers="$(curl --silent --show-error --head --max-time 5 "http://127.0.0.1:3000/collections/$path" | tr -d '\r')"
            printf '%s\n' "$headers" | grep -Eiq '^location: /collections/stush$'
          done

          for path in women essentials outerwear hoodies jerseys tops bottoms accessories; do
            status="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3000/collections/$path")"
            test "$status" = "200"
          done

          debug_status="$(curl --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/debug-shopify)"
          test "$debug_status" = "404"

          checkout_status="$(curl --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3000/api/checkout)"
          test "$checkout_status" = "400"

      - name: Install visual QA browser
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Screenshot and verify visual contracts
        shell: bash
        run: |
          npm run start > /tmp/stush-visual.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --silent --fail --max-time 5 --output /dev/null http://127.0.0.1:3000/; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/stush-visual.log
            exit 1
          fi

          VISUAL_BASE_URL=http://127.0.0.1:3000 node tests/visual-qa.mjs

      - name: Upload STUSH visual QA v2 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stush-visual-qa-v2-${{ github.sha }}
          path: artifacts/visual-qa
          if-no-files-found: error
          retention-days: 30
